# db
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=none

# db-dev
%dev.quarkus.datasource.jdbc.url=${DB_DEV_URL:jdbc:postgresql://localhost:5432/resource-hub}
%dev.quarkus.datasource.username=${DB_DEV_USER:postgres}
%dev.quarkus.datasource.password=${DB_DEV_PASSWORD:postgres}
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# db-prod
%prod.quarkus.datasource.jdbc.url=${DB_PROD_URL}
%prod.quarkus.datasource.username=${DB_PROD_USER}
%prod.quarkus.datasource.password=${DB_PROD_PASSWORD}
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# db-test
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create